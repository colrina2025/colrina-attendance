<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Colrina Attendance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#16213e;--accent:#e94560;--green:#00d4aa;--yellow:#ffd060;--text:#f0f0f0;--muted:#888;--radius:16px}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:40px}
  .header{width:100%;background:var(--surface);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff10}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-text{font-size:18px;font-weight:700;letter-spacing:1px}
  .logo-sub{font-size:11px;color:var(--muted);letter-spacing:2px}
  .time-display .time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .time-display .date{font-size:11px;color:var(--muted);text-align:right}
  .container{width:100%;max-width:480px;padding:16px}

  /* Employee card */
  .emp-card{width:100%;max-width:480px;margin:16px 16px 0;background:var(--surface2);border-radius:14px;padding:16px;display:none;align-items:center;gap:14px;border:1px solid #ffffff10}
  .emp-avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
  .emp-name-text{font-size:16px;font-weight:600}
  .emp-meta-text{font-size:12px;color:var(--muted);margin-top:3px}
  .emp-type-badge{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .type-office{background:#00d4aa20;color:var(--green)}
  .type-worker{background:#ffd06020;color:var(--yellow)}

  /* Camera */
  .camera-wrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#000}
  video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}

  /* Scanning animation overlay */
  .scan-overlay{position:absolute;inset:0;pointer-events:none}
  .face-oval{display:none}
  .face-oval.scanning{display:none}
  .face-oval.matched{display:none}
  .face-oval.failed{display:none}
  .scan-line{display:none !important}
  @keyframes scanline{}

  /* Simple scanning border on camera */
  .camera-wrap.scanning-active{border:3px solid var(--yellow);box-shadow:0 0 20px #ffd06040}
  .camera-wrap.matched-active{border:3px solid var(--green);box-shadow:0 0 30px #00d4aa60}
  .camera-wrap.failed-active{border:3px solid var(--accent);box-shadow:0 0 20px #e9456040}

  /* Status bar */
  .status-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.75);padding:10px 14px;text-align:center}
  .status-text{font-size:13px;font-weight:500;color:#fff}
  .status-sub{font-size:11px;color:var(--muted);margin-top:2px}

  /* GPS */
  .gps-status{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:10px}
  .gps-ok{background:#00d4aa15;color:var(--green);border:1px solid #00d4aa30}
  .gps-fail{background:#e9456015;color:var(--accent);border:1px solid #e9456030}
  .gps-loading{background:#ffd06015;color:var(--yellow);border:1px solid #ffd06030}
  .gps-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}

  /* Result */
  .result-card{text-align:center;padding:32px 24px;background:var(--surface);border-radius:var(--radius);border:1px solid #ffffff08}
  .result-icon{font-size:80px;margin-bottom:16px}
  .result-name{font-size:24px;font-weight:700;margin-bottom:4px}
  .result-action{font-size:16px;color:var(--muted);margin-bottom:16px}
  .result-time{font-size:48px;font-weight:300;color:var(--green);font-variant-numeric:tabular-nums;margin:12px 0}
  .result-location{font-size:12px;padding:6px 14px;border-radius:20px;display:inline-block;margin-top:8px}
  .loc-ok{background:#00d4aa15;color:var(--green)}
  .loc-warn{background:#ffd06015;color:var(--yellow)}
  .late-badge{display:inline-block;background:#e9456020;color:var(--accent);padding:4px 12px;border-radius:20px;font-size:12px;margin-top:10px}
  .btn-reset{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text);border:1px solid #ffffff15;margin-top:20px}

  /* Invalid */
  .invalid-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px}

  /* Loading overlay */
  .loading-overlay{display:none;position:fixed;inset:0;background:rgba(15,15,26,0.95);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:16px}
  .loading-overlay.show{display:flex}
  .spinner{width:48px;height:48px;border:3px solid #ffffff15;border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{color:var(--muted);font-size:14px;text-align:center;max-width:280px}
  .progress-wrap{width:280px;height:6px;background:#ffffff15;border-radius:3px;overflow:hidden;display:none}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;width:0%;transition:width 0.5s ease}
  .progress-label{font-size:12px;color:var(--green);text-align:center;min-height:18px}

  /* Retry button */
  .btn-retry{width:100%;padding:13px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;display:none}
</style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Verifying your link...</div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-text">COLRINA</div>
      <div class="logo-sub">Attendance</div>
    </div>
  </div>
  <div class="time-display">
    <div class="time" id="clock">--:--</div>
    <div class="date" id="dateDisplay">--</div>
  </div>
</div>

<!-- Employee Card -->
<div class="emp-card" id="empCard">
  <div class="emp-avatar" id="empAvatar"></div>
  <div>
    <div class="emp-name-text" id="empNameText">-</div>
    <div class="emp-meta-text" id="empMetaText">-</div>
  </div>
  <span class="emp-type-badge" id="empTypeBadge"></span>
</div>

<!-- Invalid Link -->
<div class="invalid-wrap" id="invalidWrap" style="display:none">
  <div style="font-size:56px">🔗</div>
  <div style="font-size:20px;font-weight:700;margin-top:16px">Invalid Link</div>
  <div style="font-size:13px;color:var(--muted);margin-top:8px">Please use your personal attendance link sent by HR.</div>
</div>

<!-- Main -->
<div class="container" id="mainContent" style="display:none">

  <!-- Camera Section -->
  <div id="sectionCamera">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-overlay">
        <div class="face-oval" id="faceOval"></div>
        <div class="scan-line" id="scanLine"></div>
        <div class="status-bar">
          <div class="status-text" id="statusText">Preparing camera...</div>
          <div class="status-sub" id="statusSub"></div>
        </div>
      </div>
    </div>
    <div class="gps-status gps-loading" id="gpsStatus" style="margin-top:12px">
      <div class="gps-dot"></div>
      <span id="gpsText">Getting your location...</span>
    </div>
    <button class="btn-retry" id="btnRetry" onclick="startAutoScan()">🔄 Try Again</button>
  </div>

  <!-- Result Section -->
  <div id="sectionResult" style="display:none">
    <div class="result-card">
      <div class="result-icon" id="resultIcon">✅</div>
      <div class="result-name" id="resultName">-</div>
      <div class="result-action" id="resultAction">-</div>
      <div class="result-time" id="resultTime">-</div>
      <div class="result-location" id="resultLocation">-</div>
      <div id="lateBadge" style="display:none"><span class="late-badge">⚠️ Marked Late</span></div>
      <button class="btn-reset" onclick="resetForNextPunch()">🔄 Mark Another Punch</button>
    </div>
  </div>

</div>

<script>
// ── Config ────────────────────────────────────────────────────
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwk4R4cmf8quXYcd-f8fMJ-BNZAzax_9erfqNfoLlHIWVomFieup2L6aIFrgTXeVeUbbQ/exec";
const WEIGHTS_URL     = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
const FACEAPI_URL     = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js'; const FACEAPI_URL2 = 'https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js';

// ── URL Params ────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const EMP_ID = params.get('emp')   || '';
const TOKEN  = params.get('token') || '';

// ── State ─────────────────────────────────────────────────────
let empData        = null;
let allDescriptors = [];
let gpsData        = { lat: null, lng: null, ok: false };
let stream         = null;
let faceApiLoaded  = false;
let scanning       = false;
let scanInterval   = null;
let punchSubmitted = false;

// ── Clock ─────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent       = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
}
setInterval(updateClock, 1000); updateClock();

// ── Boot ──────────────────────────────────────────────────────
window.onload = async function() {
  if (!EMP_ID || !TOKEN) { showInvalid(); return; }
  showLoading('Verifying your link...');
  try {
    const url = APPS_SCRIPT_URL + '?action=validate&empId=' + encodeURIComponent(EMP_ID) + '&token=' + encodeURIComponent(TOKEN);
    const res = await fetch(url);
    const emp = await res.json();
    if (!emp.valid) { hideLoading(); showInvalid(); return; }
    empData = emp;
    showEmpCard();
    document.getElementById('mainContent').style.display = 'block';
    // Start everything in parallel
    startCamera();
    getGPS();
    await loadFaceApi();
    // Once face API loaded — start auto scanning
    startAutoScan();
  } catch(e) {
    hideLoading();
    showInvalid();
  }
};

// ── Show Employee Card ────────────────────────────────────────
function showEmpCard() {
  document.getElementById('empCard').style.display = 'flex';
  const av = document.getElementById('empAvatar');
  av.textContent = empData.name[0].toUpperCase();
  document.getElementById('empNameText').textContent = empData.name;
  document.getElementById('empMetaText').textContent = empData.empId + ' · ' + empData.department;
  const b = document.getElementById('empTypeBadge');
  b.textContent = empData.type;
  b.className   = 'emp-type-badge ' + (empData.type === 'Office' ? 'type-office' : 'type-worker');
}

function showInvalid() {
  document.getElementById('invalidWrap').style.display = 'flex';
}

// ── Camera ────────────────────────────────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640, height:480 } });
    document.getElementById('video').srcObject = stream;
  } catch(e) {
    setStatus('⚠️ Allow camera access', 'Tap address bar → allow camera');
  }
}

// ── GPS ───────────────────────────────────────────────────────
function getGPS() {
  if (!navigator.geolocation) { setGPS(false, 'GPS not supported'); return; }
  navigator.geolocation.getCurrentPosition(
    p => { gpsData = { lat: p.coords.latitude, lng: p.coords.longitude, ok: true }; setGPS(true, '📍 Location ready (±' + Math.round(p.coords.accuracy) + 'm)'); },
    () => { setGPS(false, '❌ Allow location access'); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
function setGPS(ok, text) {
  const el = document.getElementById('gpsStatus');
  el.className = 'gps-status ' + (ok ? 'gps-ok' : 'gps-fail');
  document.getElementById('gpsText').textContent = text;
}

// ── Load Face API ─────────────────────────────────────────────
async function loadFaceApi() {
  document.getElementById('progressWrap').style.display = 'block';
  setProgress(10, 'Loading face library...');

  await new Promise((resolve, reject) => {
    if (window.faceapi) { resolve(); return; }
    const s = document.createElement('script');
    s.src = FACEAPI_URL;
    s.onload = resolve;
    s.onerror = () => {
      // Try backup URL
      const s2 = document.createElement('script');
      s2.src = FACEAPI_URL2;
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
  setProgress(25, 'Library loaded ✅');

  const WEIGHTS_URLS = [
    'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights',
    'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights',
    'https://unpkg.com/face-api.js@0.22.2/weights'
  ];

  let loaded = false;
  for (let wi = 0; wi < WEIGHTS_URLS.length && !loaded; wi++) {
    const wUrl = WEIGHTS_URLS[wi];
    try {
      setProgress(40, 'Loading face detector... (source ' + (wi+1) + ')');
      await faceapi.nets.tinyFaceDetector.loadFromUri(wUrl);
      setProgress(60, 'Loading face landmarks...');
      await faceapi.nets.faceLandmark68Net.loadFromUri(wUrl);
      setProgress(80, 'Loading recognition model...');
      await faceapi.nets.faceRecognitionNet.loadFromUri(wUrl);
      faceApiLoaded = true;
      loaded = true;
      setProgress(90, 'Models loaded ✅');
    } catch(e) {
      setProgress(30, 'Trying next source...');
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  if (!loaded) {
    setStatus('⚠️ Face model failed to load', 'Check internet and refresh page');
    hideLoading();
    return;
  }

  // Load descriptors
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=descriptors');
    allDescriptors = await res.json();
  } catch(e) { allDescriptors = []; }

  setProgress(100, '✅ Ready — look at the camera');
  await new Promise(r => setTimeout(r, 600));
  hideLoading();
  document.getElementById('progressWrap').style.display = 'none';
}

// ── Auto Face Scanning ────────────────────────────────────────
function startAutoScan() {
  if (scanning || punchSubmitted) return;
  scanning = true;
  document.getElementById('btnRetry').style.display = 'none';

  const cam = document.getElementById('cameraWrap');
  cam.className = 'camera-wrap scanning-active';
  setStatus('👀 Look at the camera', 'Hold phone at face level');

  let attempts = 0;
  const MAX_ATTEMPTS = 20; // try for ~10 seconds

  scanInterval = setInterval(async () => {
    if (!faceApiLoaded || punchSubmitted) return;
    attempts++;

    const video = document.getElementById('video');
    if (!video.videoWidth) return; // camera not ready yet

    // Capture frame
    const canvas = document.createElement('canvas');
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    try {
      const det = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320 }))
        .withFaceLandmarks().withFaceDescriptor();

      if (!det) {
        setStatus('👀 Look at the camera', 'Attempt ' + attempts + '/' + MAX_ATTEMPTS);
        if (attempts >= MAX_ATTEMPTS) {
          stopScan();
          cam.className = 'camera-wrap failed-active';
          setStatus('❌ Face not detected', 'Look at camera in good lighting');
          document.getElementById('btnRetry').style.display = 'block';
        }
        return;
      }

      // Face detected — match it
      cam.className = 'camera-wrap matched-active';
      setStatus('🔍 Face detected — matching...', '');
      let bestMatch = null, bestDist = 1;
      for (const fd of allDescriptors) {
        const d = faceapi.euclideanDistance(det.descriptor, new Float32Array(fd.faceDescriptor));
        if (d < bestDist) { bestDist = d; bestMatch = fd; }
      }
      const pct = Math.round((1 - bestDist) * 100);

      if (bestMatch && bestMatch.empId === empData.empId && pct >= 55) {
        // ✅ Match found
        stopScan();
        cam.className = 'camera-wrap matched-active';
        setStatus('✅ Face matched — ' + pct + '%', 'Marking attendance...');
        empData._faceMatch = pct + '%';

        // Wait for GPS if not ready
        if (!gpsData.ok) {
          setStatus('⏳ Waiting for GPS...', 'Getting your location');
          await new Promise(r => setTimeout(r, 3000));
        }

        // Submit punch
        await submitPunch(canvas);

      } else if (bestMatch && bestMatch.empId !== empData.empId) {
        stopScan();
        cam.className = 'camera-wrap failed-active';
        setStatus('❌ Wrong person detected', 'This link belongs to ' + empData.name);
        document.getElementById('btnRetry').style.display = 'block';
      } else {
        setStatus('🔍 Matching... ' + pct + '%', 'Hold still');
      }

    } catch(e) { /* keep trying */ }

  }, 500); // scan every 500ms
}

function stopScan() {
  scanning = false;
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
}

// ── Submit Punch ──────────────────────────────────────────────
async function submitPunch(canvas) {
  if (punchSubmitted) return;
  punchSubmitted = true;

  // Stop camera stream
  if (stream) stream.getTracks().forEach(t => t.stop());

  try {
    const punchData = {
      action:    'punch',
      empId:     empData.empId,
      token:     TOKEN,
      lat:       gpsData.lat   || 0,
      lng:       gpsData.lng   || 0,
      faceMatch: empData._faceMatch || '0%',
      device:    navigator.userAgent.substring(0, 50)
    };
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(punchData),
      headers: {'Content-Type':'text/plain'}
    });
    const data = await res.json();

    if (data.success) showResult(data);
    else {
      setStatus('⚠️ ' + data.message, '');
      document.getElementById('btnRetry').style.display = 'block';
      punchSubmitted = false;
    }
  } catch(e) {
    setStatus('❌ Network error — try again', '');
    document.getElementById('btnRetry').style.display = 'block';
    punchSubmitted = false;
  }
}

// ── Show Result ───────────────────────────────────────────────
function showResult(res) {
  document.getElementById('sectionCamera').style.display = 'none';
  document.getElementById('sectionResult').style.display = 'block';

  const isIn = res.punchType === 'IN';
  document.getElementById('resultIcon').textContent   = isIn ? '✅' : '👋';
  document.getElementById('resultName').textContent   = res.empName;
  document.getElementById('resultAction').textContent = isIn ? 'Checked IN' : 'Checked OUT';
  document.getElementById('resultTime').textContent   = res.time;

  const locEl   = document.getElementById('resultLocation');
  const outside = res.locationStatus && res.locationStatus.includes('Outside');
  locEl.textContent = '📍 ' + (res.locationStatus || 'Location recorded');
  locEl.className   = 'result-location ' + (outside ? 'loc-warn' : 'loc-ok');

  document.getElementById('lateBadge').style.display = res.lateNote ? 'block' : 'none';
}

// ── Reset for next punch ──────────────────────────────────────
function resetForNextPunch() {
  punchSubmitted = false;
  scanning       = false;
  gpsData        = { lat: null, lng: null, ok: false };

  document.getElementById('sectionCamera').style.display = 'block';
  document.getElementById('sectionResult').style.display = 'none';
  document.getElementById('cameraWrap').className = 'camera-wrap';
  document.getElementById('btnRetry').style.display = 'none';

  startCamera();
  getGPS();
  startAutoScan();
}

// ── Helpers ───────────────────────────────────────────────────
function setStatus(text, sub) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusSub').textContent  = sub || '';
}
function setProgress(pct, label) {
  document.getElementById('progressBar').style.width   = pct + '%';
  document.getElementById('progressLabel').textContent = label;
  document.getElementById('loadingText').textContent   = 'Loading face recognition... ' + pct + '%';
}
function showLoading(t) { document.getElementById('loadingText').textContent = t; document.getElementById('loadingOverlay').classList.add('show'); }
function hideLoading()  { document.getElementById('loadingOverlay').classList.remove('show'); }

// Service worker for caching
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
