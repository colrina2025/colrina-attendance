<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Register Employee — Colrina</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#16213e;--accent:#e94560;--green:#00d4aa;--yellow:#ffd060;--text:#f0f0f0;--muted:#888;--radius:16px}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
  .header{background:var(--surface);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff10}
  .logo-text{font-size:18px;font-weight:700;letter-spacing:1px}
  .logo-sub{font-size:11px;color:var(--muted);letter-spacing:2px}
  .container{max-width:500px;margin:0 auto;padding:20px 16px}
  .card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:14px;border:1px solid #ffffff08}
  .card-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px}
  .form-group{margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;background:var(--bg);border:1px solid #ffffff15;border-radius:10px;padding:13px 14px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  select option{background:#1a1a2e}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .camera-wrap{position:relative;width:100%;max-width:320px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#000;margin:0 auto;border:3px solid transparent;transition:border 0.3s}
  .camera-wrap.ready{border-color:var(--green)}
  video{width:100%;height:100%;object-fit:cover}
  .sample-strip{display:flex;gap:8px;margin-top:12px;justify-content:center}
  .sample-slot{width:60px;height:80px;border-radius:8px;border:2px dashed #ffffff20;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);overflow:hidden}
  .sample-slot img{width:100%;height:100%;object-fit:cover}
  .sample-slot.done{border-color:var(--green);border-style:solid}
  .status-box{padding:12px 14px;border-radius:10px;font-size:13px;margin-top:10px;text-align:center;font-weight:500}
  .status-loading{background:#ffd06015;border:1px solid #ffd06030;color:var(--yellow)}
  .status-ok{background:#00d4aa15;border:1px solid #00d4aa30;color:var(--green)}
  .status-err{background:#e9456015;border:1px solid #e9456030;color:var(--accent)}
  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
  .btn:disabled{opacity:0.35;cursor:not-allowed}
  .btn-capture{background:var(--surface2);color:var(--text);border:1px solid #ffffff15}
  .btn-save{background:linear-gradient(135deg,#e94560,#c0392b);color:#fff;font-size:15px}
  .btn-wa{background:#25D366;color:#fff;font-size:15px;font-weight:700}
  .btn-copy{background:transparent;border:1px solid #ffffff15;color:var(--muted);font-size:13px}
  .btn-add{background:var(--accent);color:#fff;font-size:14px;font-weight:700}
  .link-card{background:#00d4aa10;border:1px solid #00d4aa30;border-radius:14px;padding:20px;margin-top:14px;display:none}
  .link-title{font-size:16px;font-weight:700;color:var(--green);margin-bottom:4px}
  .link-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .link-box{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:12px;border:1px solid #ffffff10;line-height:1.6}
  .loading-overlay{display:none;position:fixed;inset:0;background:rgba(15,15,26,0.95);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:16px}
  .loading-overlay.show{display:flex}
  .spinner{width:48px;height:48px;border:3px solid #ffffff15;border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{color:var(--muted);font-size:14px;text-align:center;max-width:280px;padding:0 20px}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Please wait...</div>
</div>
<div class="header">
  <div><div class="logo-text">COLRINA</div><div class="logo-sub">Add Employee</div></div>
  <a href="#" style="color:var(--muted);text-decoration:none;font-size:13px">Dashboard →</a>
</div>
<div class="container">
  <div style="font-size:22px;font-weight:700;margin-bottom:4px">Register Employee</div>
  <div style="font-size:13px;color:var(--muted);margin-bottom:20px">3 face samples for strong recognition</div>

  <div class="card" id="formCard">
    <div class="card-title">Employee Details</div>
    <div class="row">
      <div class="form-group"><label>Emp Code *</label><input type="text" id="empId" placeholder="e.g. COL001" oninput="checkReady()"></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="phone" placeholder="10 digits"></div>
    </div>
    <div class="form-group"><label>Full Name *</label><input type="text" id="name" placeholder="Full name" oninput="checkReady()"></div>
    <div class="row">
      <div class="form-group">
        <label>Department *</label>
        <select id="department" onchange="loadRoles();checkReady()"><option value="">Loading...</option></select>
      </div>
      <div class="form-group">
        <label>Designation *</label>
        <select id="designation" onchange="checkReady()"><option value="">Select Dept first</option></select>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Type *</label>
        <select id="empType" onchange="checkReady()">
          <option value="">Select...</option>
          <option value="Office">🏢 Office</option>
          <option value="Worker">👷 Worker</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
      </div>
    </div>
    <div class="row">
      <div class="form-group"><label>Shift Start</label><input type="time" id="shiftStart" value="09:00"></div>
      <div class="form-group"><label>Shift End</label><input type="time" id="shiftEnd" value="18:00"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📸 Face Capture (3 samples)</div>
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="sample-strip">
      <div class="sample-slot" id="slot1">1</div>
      <div class="sample-slot" id="slot2">2</div>
      <div class="sample-slot" id="slot3">3</div>
    </div>
    <div class="status-box status-loading" id="statusBox">⏳ Loading face model...</div>
    <button class="btn btn-capture" id="btnCapture" onclick="captureSample()" disabled>⏳ Please wait...</button>
  </div>

  <button class="btn btn-save" id="btnSave" onclick="saveEmployee()" disabled>💾 Save Employee & Generate Link</button>

  <div class="link-card" id="linkCard">
    <div class="link-title">✅ Employee Registered!</div>
    <div class="link-sub" id="linkSub">Personal link generated</div>
    <div class="link-box" id="linkBox">-</div>
    <button class="btn btn-wa" onclick="shareWhatsApp()">📲 Send on WhatsApp</button>
    <button class="btn btn-copy" onclick="copyLink()">📋 Copy Link</button>
    <button class="btn btn-add" onclick="location.reload()">➕ Add Another Employee</button>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwk4R4cmf8quXYcd-f8fMJ-BNZAzax_9erfqNfoLlHIWVomFieup2L6aIFrgTXeVeUbbQ/exec";
const GITHUB_PAGES_URL = "https://colrina2025.github.io/colrina-attendance";

let ROLES = {};
let faceDescriptors = []; // array of 3 sample descriptors
let averagedDescriptor = null;
let faceApiLoaded = false, stream = null;
let _link='', _empName='', _empPhone='';

async function loadDepartments() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=deptRoles');
    ROLES = await res.json();
    const sel = document.getElementById('department');
    sel.innerHTML = '<option value="">Select...</option>';
    Object.keys(ROLES).sort().forEach(d => {
      const o = document.createElement('option');
      o.value = d; o.textContent = d;
      sel.appendChild(o);
    });
  } catch(e) {}
}
loadDepartments();

function loadRoles() {
  const dept = document.getElementById('department').value;
  const sel = document.getElementById('designation');
  sel.innerHTML = '<option value="">Select...</option>';
  if (dept && ROLES[dept]) ROLES[dept].forEach(r => {
    const o = document.createElement('option');
    o.value = r; o.textContent = r;
    sel.appendChild(o);
  });
}

async function startCamera() {
  try {
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    document.getElementById('video').srcObject = stream;
  } catch(e) { setStatus('err','❌ Camera denied'); }
}
startCamera();

async function loadFaceApiRobust() {
  const CDN = [
    { js:'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js', w:'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model' },
    { js:'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/dist/face-api.min.js', w:'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights' },
    { js:'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js', w:'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights' }
  ];
  setStatus('loading','⏳ Loading face model...');
  let libLoaded = false;
  for (const cdn of CDN) {
    if (window.faceapi) { libLoaded=true; break; }
    try {
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src=cdn.js; s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
        setTimeout(rej,15000);
      });
      libLoaded=true; break;
    } catch(e) {}
  }
  if (!libLoaded) { setStatus('err','❌ Model failed'); return; }

  for (const cdn of CDN) {
    try {
      // Load SSD MobileNet (more accurate) + Landmarks + Recognition
      await faceapi.nets.tinyFaceDetector.loadFromUri(cdn.w);
      await faceapi.nets.faceLandmark68Net.loadFromUri(cdn.w);
      await faceapi.nets.faceRecognitionNet.loadFromUri(cdn.w);
      faceApiLoaded = true;
      setStatus('ok','✅ Ready! Capture 3 face samples (different angles)');
      document.getElementById('btnCapture').disabled = false;
      document.getElementById('btnCapture').textContent = '📸 Capture Sample 1';
      document.getElementById('cameraWrap').classList.add('ready');
      return;
    } catch(e) { continue; }
  }
  setStatus('err','❌ Model download failed');
}
loadFaceApiRobust();

async function captureSample() {
  if (!faceApiLoaded) return;
  if (faceDescriptors.length >= 3) return;

  const video = document.getElementById('video');
  if (!video.videoWidth) { alert('Camera not ready'); return; }

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  showLoading('Detecting face... (high accuracy mode)');
  try {
    const det = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 }))
      .withFaceLandmarks().withFaceDescriptor();
    hideLoading();

    if (!det || !det.descriptor) {
      setStatus('err','❌ No face detected. Retake with better light.');
      return;
    }

    faceDescriptors.push(Array.from(det.descriptor));
    const idx = faceDescriptors.length;
    const slot = document.getElementById('slot'+idx);
    slot.classList.add('done');
    const img = canvas.toDataURL('image/jpeg', 0.7);
    slot.innerHTML = '<img src="'+img+'">';

    if (faceDescriptors.length < 3) {
      const nextIdx = faceDescriptors.length + 1;
      const guides = ['face slightly left', 'face slightly right'];
      setStatus('ok','✅ Sample '+idx+' saved. Now capture sample '+nextIdx+' — turn '+guides[idx-1]);
      document.getElementById('btnCapture').textContent = '📸 Capture Sample ' + nextIdx;
    } else {
      // Average all 3 descriptors
      const avg = new Array(faceDescriptors[0].length).fill(0);
      for (const d of faceDescriptors) {
        for (let i = 0; i < d.length; i++) avg[i] += d[i];
      }
      for (let i = 0; i < avg.length; i++) avg[i] /= faceDescriptors.length;
      averagedDescriptor = avg;
      setStatus('ok','✅ All 3 samples captured! Face profile ready.');
      document.getElementById('btnCapture').textContent = '✅ Done';
      document.getElementById('btnCapture').disabled = true;
      checkReady();
    }
  } catch(e) {
    hideLoading();
    setStatus('err','❌ Detection error');
  }
}

function checkReady() {
  const id = document.getElementById('empId').value.trim();
  const name = document.getElementById('name').value.trim();
  const dept = document.getElementById('department').value;
  const desig = document.getElementById('designation').value;
  const type = document.getElementById('empType').value;
  const ready = id && name && dept && desig && type && averagedDescriptor;
  document.getElementById('btnSave').disabled = !ready;
}

async function saveEmployee() {
  if (!averagedDescriptor) { alert('Please capture 3 face samples first'); return; }
  const empData = {
    action: 'register',
    empId: document.getElementById('empId').value.trim(),
    name: document.getElementById('name').value.trim(),
    department: document.getElementById('department').value,
    designation: document.getElementById('designation').value,
    phone: document.getElementById('phone').value.trim(),
    type: document.getElementById('empType').value,
    shiftStart: document.getElementById('shiftStart').value,
    shiftEnd: document.getElementById('shiftEnd').value,
    status: document.getElementById('status').value,
    faceDescriptor: averagedDescriptor,
    githubPagesUrl: GITHUB_PAGES_URL
  };
  showLoading('Saving...');
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try {
    const payload = encodeURIComponent(JSON.stringify(empData));
    const res = await fetch(APPS_SCRIPT_URL + '?action=register&data=' + payload);
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch(e) { throw new Error(text.substring(0,80)); }
    hideLoading();
    if (data.success) {
      _link = data.personalLink; _empName = data.name; _empPhone = data.phone;
      document.getElementById('formCard').style.display='none';
      document.getElementById('btnSave').style.display='none';
      document.getElementById('linkCard').style.display='block';
      document.getElementById('linkSub').textContent = data.name+' ('+data.empId+') — strong recognition ready';
      document.getElementById('linkBox').textContent = data.personalLink;
    } else alert('❌ '+data.message);
  } catch(e) { hideLoading(); alert('❌ '+e.message); }
}

function shareWhatsApp() {
  const msg = encodeURIComponent('Hi '+_empName+',\n\nYour Colrina Attendance link:\n'+_link);
  const phone = _empPhone ? (_empPhone.length===10?'91'+_empPhone:_empPhone) : '';
  window.open(phone?'https://wa.me/'+phone+'?text='+msg:'https://wa.me/?text='+msg,'_blank');
}
function copyLink() {
  navigator.clipboard.writeText(_link).then(()=>{
    const b=document.querySelector('.btn-copy'); b.textContent='✅ Copied!';
    setTimeout(()=>b.textContent='📋 Copy Link',2000);
  });
}
function setStatus(t,txt) {
  const b=document.getElementById('statusBox');
  b.className='status-box status-'+t; b.textContent=txt;
}
function showLoading(t){document.getElementById('loadingText').textContent=t;document.getElementById('loadingOverlay').classList.add('show')}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show')}
</script>
</body>
</html>
